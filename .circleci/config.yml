version: 2.1

orbs:
    codecov: 'codecov/codecov@6'

executors:
    node_min:
        resource_class: 'small'
        docker:
            -
                name: 'main'
                image: 'cimg/node:18.20'

    node_plus1:
        resource_class: 'small'
        docker:
            -
                name: 'main'
                image: 'cimg/node:20.18'

    node_plus2:
        resource_class: 'small'
        docker:
            -
                name: 'main'
                image: 'cimg/node:21.7'

    node_plus3:
        resource_class: 'small'
        docker:
            -
                name: 'main'
                image: 'cimg/node:22.12'

    node_plus4:
        resource_class: 'small'
        docker:
            -
                name: 'main'
                image: 'cimg/node:23.5'

commands:
    yarn_install:
        description: 'Install Yarn dependencies with cache restore and save'
        steps:
            -
                restore_cache:
                    name: 'Yarn install - cache restore'
                    keys:
                        - 'yarn-{{ checksum "./yarn.lock" }}-1'
            -
                run:
                    name: 'Yarn install - do it'
                    command: |
                        yarn install
            -
                save_cache:
                    name: 'Yarn install - Cache save'
                    key: 'yarn-{{ checksum "./yarn.lock" }}-1'
                    paths:
                        - '~/.cache/yarn/'

    lint:
        description: 'Run linters'
        steps:
            -
                run:
                    name: 'Run linters'
                    command: |
                        yarn lint

    test:
        description: 'Run tests'
        steps:
            -
                run:
                    name: 'Run tests - unit'
                    command: |
                        yarn test
            -
                codecov/upload:
                    flags: 'unit'
                    disable_search: true
                    files: './log/coverage/coverage-final.json'

jobs:
    build:
        executor: 'node_min'
        steps:
            - 'checkout'
            - 'yarn_install'
    lint:
        executor: 'node_min'
        steps:
            - 'checkout'
            - 'yarn_install'
            - 'lint'
    test:
        parameters:
            executor:
                type: 'string'
        executor: '<<parameters.executor>>'
        steps:
            - 'checkout'
            - 'yarn_install'
            - 'test'

workflows:
    lint_and_test:
        jobs:
            -
                build: {}
            -
                lint:
                    requires:
                        - 'build'
            -
                test:
                    name: 'test_<<matrix.executor>>'
                    requires:
                        - 'build'
                    matrix:
                        parameters:
                            executor:
                                - 'node_min'
                                - 'node_plus1'
                                - 'node_plus2'
                                - 'node_plus3'
                                - 'node_plus4'
